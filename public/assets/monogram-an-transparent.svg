<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Royal Gold Gradients -->
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9C46" />
      <stop offset="20%" stop-color="#F9EB9D" />
      <stop offset="40%" stop-color="#DFB35A" />
      <stop offset="60%" stop-color="#C28B34" />
      <stop offset="80%" stop-color="#FBEA99" />
      <stop offset="100%" stop-color="#8F5E1E" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8F5E1E" />
      <stop offset="35%" stop-color="#D6A54B" />
      <stop offset="70%" stop-color="#FFF2A8" />
      <stop offset="100%" stop-color="#9A6922" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#704412" />
      <stop offset="100%" stop-color="#FFE885" />
    </linearGradient>

    <!-- Flower Pink Gradients -->
    <radialGradient id="petalGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="45%" stop-color="#F7AABF" />
      <stop offset="85%" stop-color="#E27495" />
      <stop offset="100%" stop-color="#BE4C70" />
    </radialGradient>

    <radialGradient id="petalGrad2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF0F4" />
      <stop offset="50%" stop-color="#FBB4C7" />
      <stop offset="100%" stop-color="#CD587E" />
    </radialGradient>

    <!-- Leaf Olive / Sage Gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#939D68" />
      <stop offset="50%" stop-color="#6F7945" />
      <stop offset="100%" stop-color="#4B532C" />
    </linearGradient>

    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B074" />
      <stop offset="60%" stop-color="#7E8A4E" />
      <stop offset="100%" stop-color="#555E32" />
    </linearGradient>

    <!-- Branch Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80593B" />
      <stop offset="50%" stop-color="#5C3B24" />
      <stop offset="100%" stop-color="#3F2716" />
    </linearGradient>

    <!-- Drop Shadow Filter for Realistic 3D Emboss -->
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#553018" flood-opacity="0.32" />
    </filter>

    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="monogram-art" filter="url(#shadowFilter)">
    <!-- ============================================== -->
    <!-- LEFT BOTANICAL WREATH (Branch, Leaves, Flowers) -->
    <!-- ============================================== -->
    <g id="left-wreath">
      <!-- Main Stem -->
      <path d="M 330 600 C 260 580, 200 520, 180 430 C 165 360, 180 280, 225 210 C 240 185, 270 160, 310 140"
            fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 230 470 C 195 440, 160 380, 175 320"
            fill="none" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round" />

      <!-- Leaves Left Branch -->
      <!-- Lower leaves -->
      <path d="M 290 575 C 265 590, 245 585, 240 565 C 255 550, 275 555, 290 575 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 270 545 C 240 550, 220 535, 225 515 C 245 510, 260 525, 270 545 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 220 510 C 190 515, 175 495, 185 475 C 205 475, 215 495, 220 510 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />

      <!-- Mid leaves -->
      <path d="M 180 425 C 145 420, 135 395, 150 375 C 170 385, 175 405, 180 425 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 175 365 C 145 350, 140 325, 160 310 C 180 320, 180 345, 175 365 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 190 310 C 165 290, 168 265, 190 255 C 205 270, 205 295, 190 310 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />

      <!-- Upper leaves -->
      <path d="M 215 250 C 195 225, 205 200, 230 195 C 240 215, 235 235, 215 250 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 255 195 C 245 170, 260 150, 285 150 C 290 170, 280 188, 255 195 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 295 155 C 295 130, 315 118, 335 125 C 330 145, 315 155, 295 155 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />

      <!-- Pink Flower Blossom Cluster (Lower Left) -->
      <g transform="translate(190, 435) rotate(-25)">
        <path d="M 0 0 C -15 -25, -5 -45, 10 -40 C 25 -35, 20 -15, 0 0 Z" fill="url(#petalGrad1)" />
        <path d="M 0 0 C 10 -30, 30 -35, 35 -15 C 40 5, 20 15, 0 0 Z" fill="url(#petalGrad2)" opacity="0.95" />
        <path d="M 0 0 C -25 -10, -35 10, -20 25 C -5 40, 10 15, 0 0 Z" fill="url(#petalGrad1)" opacity="0.9" />
        <path d="M 0 0 C 5 20, 25 35, 35 20 C 45 5, 20 -5, 0 0 Z" fill="url(#petalGrad2)" />
        <ellipse cx="6" cy="-4" rx="5" ry="4" fill="#FDE047" opacity="0.9" />
        <circle cx="8" cy="-5" r="1.5" fill="#B45309" />
        <circle cx="4" cy="-3" r="1.5" fill="#B45309" />
      </g>

      <!-- Smaller Buds -->
      <ellipse cx="230" cy="520" rx="9" ry="14" transform="rotate(-35 230 520)" fill="url(#petalGrad1)" />
      <ellipse cx="165" cy="340" rx="8" ry="13" transform="rotate(20 165 340)" fill="url(#petalGrad2)" />
      <ellipse cx="270" cy="180" rx="7" ry="11" transform="rotate(45 270 180)" fill="url(#petalGrad1)" />
    </g>

    <!-- ============================================== -->
    <!-- RIGHT BOTANICAL WREATH (Branch, Leaves, Flowers) -->
    <!-- ============================================== -->
    <g id="right-wreath">
      <!-- Main Stem Right -->
      <path d="M 570 600 C 640 580, 700 520, 720 430 C 735 360, 720 280, 675 210 C 660 185, 630 160, 590 140"
            fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 670 470 C 705 440, 740 380, 725 320"
            fill="none" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round" />

      <!-- Leaves Right Branch -->
      <path d="M 610 575 C 635 590, 655 585, 660 565 C 645 550, 625 555, 610 575 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 630 545 C 660 550, 680 535, 675 515 C 655 510, 640 525, 630 545 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 680 510 C 710 515, 725 495, 715 475 C 695 475, 685 495, 680 510 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />

      <path d="M 720 425 C 755 420, 765 395, 750 375 C 730 385, 725 405, 720 425 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 725 365 C 755 350, 760 325, 740 310 C 720 320, 720 345, 725 365 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 710 310 C 735 290, 732 265, 710 255 C 695 270, 695 295, 710 310 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />

      <path d="M 685 250 C 705 225, 695 200, 670 195 C 660 215, 665 235, 685 250 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 645 195 C 655 170, 640 150, 615 150 C 610 170, 620 188, 645 195 Z" fill="url(#leafGrad2)" stroke="#3F2716" stroke-width="0.75" />
      <path d="M 605 155 C 605 130, 585 118, 565 125 C 570 145, 585 155, 605 155 Z" fill="url(#leafGrad1)" stroke="#3F2716" stroke-width="0.75" />

      <!-- Pink Flower Blossom Cluster (Lower Right) -->
      <g transform="translate(710, 435) rotate(25)">
        <path d="M 0 0 C 15 -25, 5 -45, -10 -40 C -25 -35, -20 -15, 0 0 Z" fill="url(#petalGrad1)" />
        <path d="M 0 0 C -10 -30, -30 -35, -35 -15 C -40 5, -20 15, 0 0 Z" fill="url(#petalGrad2)" opacity="0.95" />
        <path d="M 0 0 C 25 -10, 35 10, 20 25 C 5 40, -10 15, 0 0 Z" fill="url(#petalGrad1)" opacity="0.9" />
        <path d="M 0 0 C -5 20, -25 35, -35 20 C -45 5, -20 -5, 0 0 Z" fill="url(#petalGrad2)" />
        <ellipse cx="-6" cy="-4" rx="5" ry="4" fill="#FDE047" opacity="0.9" />
        <circle cx="-8" cy="-5" r="1.5" fill="#B45309" />
        <circle cx="-4" cy="-3" r="1.5" fill="#B45309" />
      </g>

      <ellipse cx="670" cy="520" rx="9" ry="14" transform="rotate(35 670 520)" fill="url(#petalGrad1)" />
      <ellipse cx="735" cy="340" rx="8" ry="13" transform="rotate(-20 735 340)" fill="url(#petalGrad2)" />
      <ellipse cx="630" cy="180" rx="7" ry="11" transform="rotate(-45 630 180)" fill="url(#petalGrad1)" />
    </g>

    <!-- ============================================== -->
    <!-- ROYAL GOLDEN CROWN ON TOP -->
    <!-- ============================================== -->
    <g id="crown" transform="translate(450, 115) scale(0.95)">
      <!-- Crown Base Arch -->
      <path d="M -90 60 C -50 45, 50 45, 90 60 C 50 52, -50 52, -90 60 Z"
            fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="1.5" />

      <!-- Crown Circlet Rim with Jewels -->
      <path d="M -85 62 C -45 49, 45 49, 85 62 L 87 72 C 45 59, -45 59, -87 72 Z"
            fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1" />
      
      <!-- Circlet Pearls / Diamonds -->
      <circle cx="-70" cy="65" r="3.5" fill="#FFF2A8" stroke="#704412" stroke-width="0.8" />
      <circle cx="-45" cy="60" r="3.5" fill="#FFF2A8" stroke="#704412" stroke-width="0.8" />
      <circle cx="-20" cy="57" r="3.5" fill="#FFF2A8" stroke="#704412" stroke-width="0.8" />
      <circle cx="0" cy="56" r="4.5" fill="#F87171" stroke="#704412" stroke-width="0.8" />
      <circle cx="20" cy="57" r="3.5" fill="#FFF2A8" stroke="#704412" stroke-width="0.8" />
      <circle cx="45" cy="60" r="3.5" fill="#FFF2A8" stroke="#704412" stroke-width="0.8" />
      <circle cx="70" cy="65" r="3.5" fill="#FFF2A8" stroke="#704412" stroke-width="0.8" />

      <!-- Crown Spikes and Fleur-de-lis Peaks -->
      <!-- Center Main Spire with Pearl Cross -->
      <path d="M -12 55 Q -8 30, -18 15 Q 0 5, 0 -8 Q 0 5, 18 15 Q 8 30, 12 55 Z"
            fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="1.5" />
      <circle cx="0" cy="-12" r="6" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1" />

      <!-- Mid-Left Spire -->
      <path d="M -50 58 Q -48 35, -60 22 Q -45 20, -42 7 Q -35 25, -28 56 Z"
            fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1.2" />
      <circle cx="-42" cy="3" r="5" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="0.8" />

      <!-- Mid-Right Spire -->
      <path d="M 28 56 Q 35 25, 42 7 Q 45 20, 60 22 Q 48 35, 50 58 Z"
            fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1.2" />
      <circle cx="42" cy="3" r="5" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="0.8" />

      <!-- Far-Left Spire -->
      <path d="M -85 64 Q -88 45, -95 35 Q -80 38, -78 26 Q -70 45, -65 60 Z"
            fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="1" />
      <circle cx="-78" cy="22" r="4" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="0.8" />

      <!-- Far-Right Spire -->
      <path d="M 65 60 Q 70 45, 78 26 Q 80 38, 95 35 Q 88 45, 85 64 Z"
            fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="1" />
      <circle cx="78" cy="22" r="4" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="0.8" />
    </g>

    <!-- ============================================== -->
    <!-- INTERLOCKING LETTERS "A" (GROOM) & "N" (BRIDE) -->
    <!-- ============================================== -->
    <g id="interlocking-letters">
      <!-- 
        LETTER 'A' (Abir - Groom)
        Grand Roman Imperial Serif capital with delicate filigree crossbar 
      -->
      <g id="letter-A">
        <!-- Main 'A' Shape -->
        <!-- Left Stem of A -->
        <path d="M 275 560 L 250 560 L 250 540 Q 280 538, 305 520 L 375 250 L 415 250 L 335 520 Q 350 538, 385 540 L 385 560 L 350 560 Z"
              fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="2.5" />

        <!-- Right Stem of A (Thick, Powerful Roman Imperial Column) -->
        <path d="M 390 250 L 440 250 Q 450 250, 460 260 L 555 520 Q 580 538, 610 540 L 610 560 L 530 560 L 530 540 Q 555 538, 545 520 L 505 415 L 350 415 L 390 250 Z"
              fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="2.5" />

        <!-- Apex Serif of A -->
        <path d="M 360 255 Q 395 240, 435 240 Q 450 240, 455 255 Z"
              fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="2" />

        <!-- Crossbar with Royal Arch Loop Intertwining N -->
        <path d="M 335 435 C 375 425, 410 405, 455 425 C 490 440, 520 435, 525 435 L 515 410 C 475 410, 445 390, 410 410 C 375 430, 345 415, 340 415 Z"
              fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="2" />

        <!-- Ornamental Flourish at base of A -->
        <path d="M 255 550 Q 235 560, 225 545 Q 215 525, 235 515 Q 255 525, 255 545 Z"
              fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="1.5" />
      </g>

      <!-- 
        LETTER 'N' (Nishi - Bride)
        Intertwined gracefully through letter A, with sweeping calligraphic swash
      -->
      <g id="letter-N">
        <!-- Left Upright of N (Intertwined behind A's right leg, in front of crossbar) -->
        <path d="M 440 560 L 415 560 L 415 540 Q 435 538, 448 520 L 448 330 Q 435 315, 415 315 L 415 295 L 480 295 L 480 315 Q 465 315, 452 330 L 452 520 Q 465 538, 485 540 L 485 560 Z"
              fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="2.5" opacity="0.97" />

        <!-- Diagonal of N (Sweeping across front with dramatic 3D gold gradient) -->
        <path d="M 450 300 L 515 300 L 640 515 L 640 560 L 590 560 L 450 325 Z"
              fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="2.5" />

        <!-- Right Upright of N with Elegant Swash -->
        <path d="M 610 560 L 585 560 L 585 540 Q 605 538, 618 520 L 618 325 Q 605 310, 580 310 L 580 290 L 665 290 L 665 310 Q 645 310, 632 325 L 632 520 Q 645 538, 675 540 L 675 560 Z"
              fill="url(#goldBase)" stroke="url(#goldStroke)" stroke-width="2.5" />

        <!-- Swash Flourish on Top Right of N -->
        <path d="M 660 295 Q 695 280, 715 300 Q 725 320, 710 335 Q 695 330, 695 315 Q 695 300, 670 305 Z"
              fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1.5" />

        <!-- Lower Swash Flourish of N -->
        <path d="M 640 535 Q 665 555, 685 540 Q 700 525, 690 510 Q 675 510, 675 522 Q 675 535, 655 530 Z"
              fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1.5" />
      </g>
    </g>

    <!-- Little Heart / Sparkle Motif connecting A & N -->
    <g transform="translate(485, 465) scale(0.9)">
      <path d="M 0 5 Q 0 -12, -14 -12 Q -26 -12, -26 2 Q -26 14, 0 32 Q 26 14, 26 2 Q 26 -12, 14 -12 Q 0 -12, 0 5 Z"
            fill="url(#goldLight)" stroke="#704412" stroke-width="1.5" />
      <circle cx="0" cy="5" r="3" fill="#FFF2A8" />
    </g>
  </g>
</svg>
